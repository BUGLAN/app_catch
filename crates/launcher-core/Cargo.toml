[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "app_catch 核心逻辑：配置、进程管理、会话 JSONL、图标捕获（不依赖 UI）"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
# 非 UTF-8 输出解码：Windows 回退到 GBK/GB18030（cp936），见 docs/SESSION_FORMAT.md「编码处理策略」
encoding_rs = { workspace = true }
# 图标缓存统一编码为 PNG，见 docs/ICONS.md「为什么用 png 而不是 image」
png = { workspace = true }

# Windows 运行时后端：Job Object 杀树 + 进程启动时间校验
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# 手动验收示例：cargo run -p launcher-core --example session_demo -- cmd /c "echo hi"
[[example]]
name = "session_demo"
path = "examples/session_demo.rs"
