[package]
name = "app-catch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "app_catch Tauri 2 壳层（command 层薄封装）"

# Tauri 2 约定：库名固定为 <name>_lib，供 main.rs 与移动端入口复用
[lib]
name = "app_catch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
# 自动更新：检查 / 下载 / 安装 GitHub Releases 上的更新包（仅桌面端初始化）
tauri-plugin-updater = { workspace = true }
# 更新装完后的「重启应用」按钮需要 relaunch
tauri-plugin-process = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
launcher-core = { workspace = true }
# 图标抓取放进 spawn_blocking：Shell API 可能慢，不能占住 tokio worker
tokio = { workspace = true }

[dev-dependencies]
# 命令层测试用临时目录隔离 APP_CATCH_HOME
tempfile = { workspace = true }
tokio = { workspace = true }
