name: Release

# 推送 v*.*.* 形式的 tag 时：矩阵构建 macOS（aarch64 + x86_64）与 Windows（x64），
# 产出安装包与更新签名件，然后创建 GitHub Release 并上传：
#   - 各平台安装包（.dmg / .app.tar.gz / -setup.exe / .msi）
#   - 合并后的更新清单 latest.json（tauri-plugin-updater 的 endpoint 指向它）
#
# 需要的仓库 secrets（缺失时签名与清单步骤会失败，构建产物仍留作 artifact）：
#   TAURI_SIGNING_PRIVATE_KEY          更新产物签名私钥（本机 ~/.app_catch-updater/app_catch.key 的内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码（本机 ~/.app_catch-updater/password.txt）
# 说明与密钥保管见 README「发布」一节。
#
# 可选的 macOS 代码签名 secrets（由 scripts/gen-macos-signing-cert.sh 生成，缺失时退回 ad-hoc 签名并告警）：
#   MACOS_SIGNING_CERT_P12       自签名证书 cert.p12 的 base64（本机 ~/.app_catch-signing/cert.p12）
#   MACOS_SIGNING_CERT_PASSWORD  cert.p12 的密码（本机 ~/.app_catch-signing/password.txt）
# 固定证书签名让用户的麦克风等隐私授权在升级后保留，见 docs/MACOS_PERMISSIONS.md。

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # softprops/action-gh-release 用自带 GITHUB_TOKEN 建 Release、传资产

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 固定到 macos-15-intel：macos-latest 当前已指向刚迁移的 macOS 26 Arm64，
        # macos-15 的 arm64 镜像同样排队超过 15 分钟并被 GitHub 取消（实测），
        # 而 x64 的 macos-15-intel 容量稳定；aarch64 产物在 Intel runner 上交叉编译即可。
        include:
          - os: macos-15-intel
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 自签名证书不能走 Tauri 的 APPLE_CERTIFICATE 导入流程（它只认 Apple 签发、带 Team ID 的证书），
      # 所以这里自己导入临时 keychain，只把 APPLE_SIGNING_IDENTITY 交给 Tauri，它会直接 `codesign -s <身份>`。
      - name: 导入 macOS 签名证书
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::warning::未配置 MACOS_SIGNING_CERT_P12 / MACOS_SIGNING_CERT_PASSWORD，macOS 产物退回 ad-hoc 签名，用户升级后隐私授权会失效"
            exit 0
          fi
          keychain="$RUNNER_TEMP/app-catch-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # 允许 codesign 免交互使用私钥
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # Tauri 调 codesign 时不带 --keychain，必须把临时 keychain 加进用户搜索列表
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # 自签名证书不受系统信任，`find-identity -v` 会把它滤掉，所以这里不加 -v；codesign 本身不要求受信任
          identity="$(security find-identity -p codesigning "$keychain" | awk '/^ *1\)/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "证书导入后找不到代码签名身份，检查 p12 是否包含私钥、证书是否带 codeSigning 用途" >&2
            security find-identity -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "使用签名身份 $identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # TAURI_SIGNING_PRIVATE_KEY 可以是私钥内容，也可以是文件路径（见 tauri signer 文档）
      - name: 打包并签名更新产物
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      # 配了证书却没签上（比如 Tauri 改了行为）时直接失败，不能悄悄发出 ad-hoc 版本
      - name: 校验 macOS 代码签名
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          app="$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$app" ]; then
            echo "找不到打包出的 .app" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          requirement="$(codesign -d -r- "$app" 2>&1)"
          echo "$requirement"
          # 固定证书签名的签名要求形如 identifier "..." and certificate leaf = H"..."；ad-hoc 则是 cdhash
          if ! printf '%s' "$requirement" | grep -q 'certificate leaf = H"'; then
            echo "签名要求里没有证书指纹，产物不是用固定证书签的" >&2
            exit 1
          fi

      - name: 清理 macOS 签名 keychain
        if: always() && runner.os == 'macOS' && env.MACOS_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true

      - name: 收集安装包与签名件
        run: |
          mkdir -p bundle-out updater-out
          # 本仓库是 Cargo workspace，target 目录在**仓库根**（不是 src-tauri/target）：
          # 写成 src-tauri/target 时 find 一条都匹配不到，upload-artifact 直接失败，
          # release job 根本不会被执行 —— 发布"只剩下 tag 没有资产"就是这么来的。
          base="target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$base" ]; then base="target/release/bundle"; fi
          if [ ! -d "$base" ]; then
            echo "找不到构建产物目录 target/${{ matrix.target }}/release/bundle" >&2
            exit 1
          fi
          # 给人下载的安装包；macOS 的 .app.tar.gz 同时是更新器要下载的资产，必须一起传
          find "$base" \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} bundle-out/ \;
          # .sig 签名件：合并 latest.json 的原料
          find "$base" -name '*.sig' -exec cp {} updater-out/ \;
          # macOS 的更新包在 Tauri 里固定叫 app_catch.app.tar.gz，两个矩阵任务同名：
          # download-artifact 的 merge-multiple 会让它们互相覆盖，release 里最终只剩一份，
          # 而 latest.json 里两套签名各指各的 —— 另一套架构更新时必然签名校验失败。
          # 这里按架构改名（签名件同步改），下载地址由签名件文件名推出，于是各指各的资产。
          mac_arch=""
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) mac_arch="aarch64" ;;
            x86_64-apple-darwin) mac_arch="x64" ;;
          esac
          if [ -n "$mac_arch" ]; then
            ( cd bundle-out && mv -f app_catch.app.tar.gz "app_catch_${mac_arch}.app.tar.gz" )
            ( cd updater-out && mv -f app_catch.app.tar.gz.sig "app_catch_${mac_arch}.app.tar.gz.sig" )
          fi
          echo "--- bundle-out ---"; ls -l bundle-out;
          echo "--- updater-out ---"; ls -l updater-out;

      - name: 上传安装包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: bundle-out
          if-no-files-found: error
          retention-days: 14

      - name: 上传签名件 artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: updater-out
          if-no-files-found: error
          retention-days: 14

  release:
    name: 创建 Release 与 latest.json
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 读 annotated tag 的完整说明做 Release 正文

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release-assets
          merge-multiple: true

      # 保持 updater-<target> 目录结构：合并脚本按目录名识别平台
      - name: 下载全部签名件
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-inputs

      - name: 提取 tag 说明为 Release 正文
        run: |
          # actions/checkout 在 tag 事件下用 "+<commit>:refs/tags/<tag>" 拉取，
          # 会把 annotated tag 覆盖成指向提交的轻量 ref，%(contents) 于是变成提交信息。
          # 这里强制按 tag 引用再取一次，拿回真正的 tag 对象与说明。
          git fetch --no-tags --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > RELEASE_BODY.md
          # 轻量 tag / 空说明的兜底：退回提交信息
          if [ ! -s RELEASE_BODY.md ]; then
            git log -1 --pretty=%B > RELEASE_BODY.md
          fi

      - name: 合并各平台签名为 latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/merge-updater-manifests.mjs \
            --inputs updater-inputs \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --version "$version" \
            --notes-file RELEASE_BODY.md \
            --out latest.json
          cat latest.json

      - name: 上传发布产物为 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            release-assets
            latest.json
          retention-days: 14

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 用仓库自带 GITHUB_TOKEN；名字与正文取自 tag
          name: ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            release-assets/*
            latest.json
          fail_on_unmatched_files: true
