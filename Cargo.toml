[workspace]
members = ["crates/launcher-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
authors = ["buglan"]
description = "app_catch: developer-oriented desktop app launcher (M0 skeleton)"

# 公共依赖在此统一声明，成员 crate 用 "<dep>.workspace = true" 引用，避免版本漂移
[workspace.dependencies]
launcher-core = { path = "crates/launcher-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 配置存储：每应用一个 TOML 文件
toml = "1"
# 错误类型统一用 thiserror 派生
thiserror = "2"
# 会话 ID 使用 uuid v4
uuid = { version = "1", features = ["v4", "serde"] }
# 跨平台用户主目录
dirs = "7"
# RFC3339 时间戳（带时区偏移，agent 可直接解析）
time = { version = "0.3", features = ["formatting", "parsing"] }
# 异步运行时：进程 spawn/等待、管道读取、有界 channel、定时 flush、异步写盘
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
    "fs",
] }
# Windows 平台 API（只用 windows-sys，不引入重型 windows crate）
# - Win32_UI_WindowsAndMessaging：窗口标题采集（EnumWindows / GetWindowTextW）
# - Win32_NetworkManagement_IpHelper：监听端口采集（GetExtendedTcpTable）
# - Win32_Networking_WinSock：仅取 AF_INET / AF_INET6 常量（IpHelper 结构体本身无需该 feature）
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }
# 文本编码：Windows 中文环境的控制台/日志默认 cp936(GBK)，输出捕获需按平台编码无损解码
encoding_rs = "0.8"
# 仅测试用：临时目录隔离 APP_CATCH_HOME
tempfile = "3"
tauri = { version = "2" }
tauri-build = { version = "2" }
